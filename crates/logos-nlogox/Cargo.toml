[package]
name = "logos-nlogox"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Reads and edits NetLogo .nlogox files without losing anything: edits replace byte spans"

[dependencies]
quick-xml = "0.38"
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Serialize and deserialize the typed widget model (for the desktop app).
serde = ["dep:serde"]

[dev-dependencies]
logos-bridge-client = { path = "../logos-bridge-client" }
