[package]
name = "logos-experiment"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "BehaviorSpace experiments: run them through the bridge and write NetLogo's output formats"

[dependencies]
arrow-array = "60"
arrow-buffer = "60"
arrow-schema = "60"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
logos-bridge-client = { path = "../logos-bridge-client" }
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
